# Benchmark-only workflow for the durable segment flush PR. Lives on bench/** branches of a fork; not for upstream.
# Compares the PR base (before any sync changes) with the pushed commit on a Linux runner.
name: bench-durable-flush
on:
  push:
    branches: [ 'bench/**' ]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BASE_SHA: 8e454baabaa99d8954d2033e427e3848d0378c5f
      MVN_FLAGS: >-
        -B -pl pinot-perf -am package -DskipTests -Dcheckstyle.skip -Dspotless.check.skip
        -Dspotless.apply.skip -Dlicense.skip -Denforcer.skip -Djacoco.skip -Drat.skip -Dmaven.javadoc.skip
      JVM_APPEND: >-
        -XX:+IgnoreUnrecognizedVMOptions --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - name: Record environment
        run: |
          mkdir -p results
          {
            uname -a; nproc; free -g; df -hT /tmp; java -version 2>&1
            echo "base=$BASE_SHA head=$(git rev-parse HEAD)"
          } > results/env.txt
          cat results/env.txt
      - name: Build current
        run: ./mvnw $MVN_FLAGS
      - name: Build baseline
        run: |
          git worktree add --detach ../baseline "$BASE_SHA"
          cp pinot-perf/src/main/java/org/apache/pinot/perf/BenchmarkSegmentCreation.java \
            ../baseline/pinot-perf/src/main/java/org/apache/pinot/perf/
          (cd ../baseline && ./mvnw $MVN_FLAGS)
      - name: Run benchmarks (baseline/current alternated twice to cancel drift)
        run: |
          run() {
            local label=$1 tree=$2 name=$3
            shift 3
            echo "::group::$label $name"
            (cd "$tree" && java -Xms4G -Xmx10G -cp "$tree/pinot-perf/target/pinot-perf-pkg/lib/*" \
              org.openjdk.jmh.Main "$@" -jvmArgsAppend="$JVM_APPEND") > "results/$label-$name.txt" 2>&1
            echo "exit=$?"; tail -5 "results/$label-$name.txt"
            echo "::endgroup::"
          }
          for round in 1 2; do
            for side in baseline current; do
              if [ "$side" = baseline ]; then tree="$(cd .. && pwd)/baseline"; else tree="$PWD"; fi
              run "$side-r$round" "$tree" segment org.apache.pinot.perf.BenchmarkSegmentCreation -wi 3 -i 10 -f 1
              run "$side-r$round" "$tree" bitmap org.apache.pinot.perf.BenchmarkOffheapBitmapInvertedIndexCreator \
                -p _numDocs=10000000 -wi 2 -i 5 -f 1
              run "$side-r$round" "$tree" rawfwd org.apache.pinot.perf.BenchmarkRawForwardIndexWriter \
                -p _records=10000 -wi 2 -i 5 -f 1
            done
          done
      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat results/env.txt
            for f in results/*-*.txt; do
              echo "== $f"
              grep -E '^Benchmark[A-Za-z]+\.[A-Za-z0-9]+ ' "$f" | grep -v ':' || true
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: bench-results
          path: results/
