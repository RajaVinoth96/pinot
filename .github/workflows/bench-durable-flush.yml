# Benchmark-only workflow for the durable segment flush PR. Lives on bench/** branches of a fork; not for upstream.
# Compares the PR base (before any sync changes) with the pushed commit on a Linux runner.
name: bench-durable-flush
on:
  push:
    branches: [ 'bench/**' ]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BASE_SHA: 8e454baabaa99d8954d2033e427e3848d0378c5f
      MVN_FLAGS: >-
        -B -pl pinot-perf -am package -DskipTests -Dcheckstyle.skip -Dspotless.check.skip
        -Dspotless.apply.skip -Dlicense.skip -Denforcer.skip -Djacoco.skip -Drat.skip -Dmaven.javadoc.skip
      JVM_APPEND: >-
        -XX:+IgnoreUnrecognizedVMOptions --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - name: Record environment
        run: |
          mkdir -p results
          {
            uname -a; nproc; free -g; df -hT /tmp; java -version 2>&1
            echo "base=$BASE_SHA head=$(git rev-parse HEAD)"
          } > results/env.txt
          cat results/env.txt
      - name: Build current
        run: ./mvnw $MVN_FLAGS
      - name: Build baseline
        run: |
          git worktree add --detach ../baseline "$BASE_SHA"
          cp pinot-perf/src/main/java/org/apache/pinot/perf/BenchmarkSegmentCreation.java \
            ../baseline/pinot-perf/src/main/java/org/apache/pinot/perf/
          (cd ../baseline && ./mvnw $MVN_FLAGS)
      - name: Record kernel writeback settings
        run: |
          sysctl vm.dirty_background_ratio vm.dirty_ratio vm.dirty_background_bytes vm.dirty_bytes \
            vm.dirty_expire_centisecs vm.dirty_writeback_centisecs | tee results/sysctl.txt
      - name: Raw fsync cost probe (per-byte and per-file cost of FileChannel.force)
        run: java .github/bench/FsyncCost.java /tmp | tee results/fsync-cost.txt
      - name: Time spent in sync calls during segment builds (strace) + background writeback (meminfo)
        run: |
          command -v strace || (sudo apt-get update -qq && sudo apt-get install -y -qq strace)
          strace -V | head -1 | tee results/strace-version.txt
          for side in baseline current; do
            if [ "$side" = baseline ]; then tree="$(cd .. && pwd)/baseline"; else tree="$PWD"; fi
            for combo in 500000:64 2000000:512; do
              rows=${combo%%:*}; len=${combo##*:}; tag="$side-$rows-$len"
              echo "::group::$tag"
              # Sample dirty / under-writeback page cache (kB) once per second while the builds run.
              ( while true; do
                  echo "$(date +%s) $(awk '/^(Dirty|Writeback):/ {printf "%s=%s ", $1, $2}' /proc/meminfo)"
                  sleep 1
                done ) > "results/meminfo-$tag.txt" &
              sampler=$!
              # -w: wall-clock time spent inside each call (what the build actually waits for); -f: follow the JMH fork.
              (cd "$tree" && strace -f --seccomp-bpf -w -c -e trace=fsync,fdatasync,msync -o "$OLDPWD/results/strace-$tag.txt" \
                java -Xms4G -Xmx10G -cp "$tree/pinot-perf/target/pinot-perf-pkg/lib/*" org.openjdk.jmh.Main \
                org.apache.pinot.perf.BenchmarkSegmentCreation -p _numRows=$rows -p _rawPayloadLength=$len \
                -wi 0 -i 3 -f 1 -jvmArgsAppend="$JVM_APPEND") > "results/jmh-$tag.txt" 2>&1 \
                || echo "::warning::strace/JMH run failed for $tag (see results/jmh-$tag.txt)"
              kill $sampler
              cat "results/strace-$tag.txt"
              grep -E '^BenchmarkSegmentCreation' "results/jmh-$tag.txt" | grep -v ':' || true
              echo "::endgroup::"
            done
          done
      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat results/env.txt results/sysctl.txt 2>/dev/null
            echo; echo "== fsync cost probe"; cat results/fsync-cost.txt 2>/dev/null
            for f in results/strace-*-*.txt; do
              tag=${f#results/strace-}; tag=${tag%.txt}
              echo; echo "== $tag (3 builds, no warmup)"
              cat "$f"
              grep -E '^BenchmarkSegmentCreation' "results/jmh-$tag.txt" | grep -v ':' || true
              awk '{for (i=2;i<=NF;i++){split($i,kv,"="); if (kv[1]=="Dirty:" && kv[2]>d) d=kv[2]; if (kv[1]=="Writeback:" && kv[2]>w) w=kv[2]}}
                   END {printf "peak Dirty=%d MB, peak Writeback=%d MB\n", d/1024, w/1024}' "results/meminfo-$tag.txt"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: bench-results
          path: results/
